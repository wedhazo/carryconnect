services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: carryconnect-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Home2022
      MYSQL_DATABASE: carryconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - carryconnect-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # CarryConnect API Application
  carryconnect-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carryconnect-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carryconnect
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Home2022
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - carryconnect-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: carryconnect-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - carryconnect-network
    depends_on:
      - carryconnect-api

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: carryconnect-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - carryconnect-network
    depends_on:
      - prometheus

networks:
  carryconnect-network:
    driver: bridge

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
